name: syncologic-local

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - kv

  srh:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '127.0.0.1:8079:80'
    depends_on:
      - redis
    networks:
      - kv

networks:
  kv:
